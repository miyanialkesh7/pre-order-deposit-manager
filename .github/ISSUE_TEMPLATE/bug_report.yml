name: Bug report
description: Report a bug with the Pre-Order Deposit Manager plugin
labels: ['[Type] Bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! If this is a security issue, please report it privately rather than filing a public issue.
  - type: textarea
    attributes:
      label: Description
      description: Please write a brief description of the bug, including what you expect to happen and what is currently happening.
      placeholder: |
        Feature '...' is not working properly. I expect '...' to happen, but '...' happens instead
    validations:
      required: true

  - type: textarea
    attributes:
      label: Step-by-step reproduction instructions
      description: Please write the steps needed to reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
    validations:
      required: true

  - type: textarea
    attributes:
      label: Screenshots, screen recording, code snippet
      description: |
        If possible, please upload a screenshot or screen recording which demonstrates the bug.
        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
        If this bug is related to a developer API (hooks/filters), please share a code snippet that demonstrates the issue.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Environment info
      description: |
        Please list the plugin, WordPress, WooCommerce, and PHP versions you are using.
      placeholder: |
        - WordPress version, WooCommerce version, Pre-Order Deposit Manager version, and active theme.
        - Whether WooCommerce High-Performance Order Storage (HPOS) is enabled or not.
        - Browser(s) you are seeing the problem on.
    validations:
      required: false

  - type: checkboxes
    id: existing
    attributes:
      label: Please confirm that you have searched existing issues in the repo.
      description: You can do this by searching the Issues tab and making sure the bug is not related to another plugin.
      options:
        - label: 'Yes'
          required: true

  - type: checkboxes
    id: plugins
    attributes:
      label: Please confirm that you have tested with all plugins deactivated except WooCommerce and Pre-Order Deposit Manager.
      options:
        - label: 'Yes'
          required: true
